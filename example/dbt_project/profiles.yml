dbt_dqx_demo:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_DQX_CATALOG', 'main') }}"
      schema: "{{ env_var('DBT_DQX_SCHEMA', 'dbt_dqx_demo') }}"
      auth_type: oauth
      threads: 4
